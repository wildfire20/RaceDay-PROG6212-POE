name: RaceDay Part 2 CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDay.slnx

      - name: Build solution
        run: dotnet build RaceDay.slnx --no-restore --configuration Release

      - name: Run automated tests
        run: dotnet test RaceDay.slnx --no-build --configuration Release --verbosity normal